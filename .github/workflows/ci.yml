name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run e2e
      - name: expo export (web, rien n’est publié)
        run: npx expo export --platform web --output-dir dist-ci
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
